version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
    build:
      commands:
        # Paystack public key for checkout (public keys are safe to expose)
        - echo "VITE_PAYSTACK_PUBLIC_KEY=$VITE_PAYSTACK_PUBLIC_KEY" >> .env
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '*.xml'
      headers:
        - key: Content-Type
          value: application/xml
    - pattern: '*.txt'
      headers:
        - key: Content-Type
          value: text/plain
    - pattern: '**/*'
      headers:
        - key: X-Frame-Options
          value: DENY
        - key: X-Content-Type-Options
          value: nosniff
        - key: X-XSS-Protection
          value: '1; mode=block'
        - key: Referrer-Policy
          value: strict-origin-when-cross-origin
        - key: Permissions-Policy
          value: camera=(), microphone=(), geolocation=()
        - key: Content-Security-Policy
          value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.paystack.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.amazonaws.com https://*.appsync-api.*.amazonaws.com wss://*.appsync-realtime-api.*.amazonaws.com https://api.paystack.co https://*.lambda-url.*.on.aws; frame-src https://checkout.paystack.com;"
customRules:
  # Serve static files directly (sitemap, robots, etc)
  - source: /sitemap.xml
    target: /sitemap.xml
    status: '200'
  - source: /robots.txt
    target: /robots.txt
    status: '200'
  - source: /favicon.svg
    target: /favicon.svg
    status: '200'
  - source: /manifest.json
    target: /manifest.json
    status: '200'
  # SPA fallback - must be last
  - source: '</^[^.]+$|\\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|xml)$)([^.]+$)/>'
    target: /index.html
    status: '200'
